# Dilamme Job Scheduler - Nginx Reverse Proxy Configuration
# ──────────────────────────────────────────────────────────────
# Place this file at: /etc/nginx/sites-available/job-scheduler
# Then symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/job-scheduler /etc/nginx/sites-enabled/
#
# Replace:
#   YOUR_DOMAIN         → your public domain (e.g., jobs.yourdomain.com)
#   BACKEND_PORT        → the port your FastAPI backend runs on (default 8000)
#   FRONTEND_DIST_PATH  → path to the built frontend (e.g., /home/ubuntu/frontend/dist)
#
# After editing, test and reload:
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # ── Redirect HTTP → HTTPS ──────────────────────────────────
    # Uncomment after obtaining SSL certificates:
    # return 301 https://$host$request_uri;

    # ── ACME challenge for Certbot ─────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ── API Docs (Proxied to the backend) ────────────────────
    # FastAPI serves interactive docs at /docs, /redoc, and /openapi.json
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://127.0.0.1:BACKEND_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend (Served as static files) ──────────────────────
    location / {
        root FRONTEND_DIST_PATH;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API (Proxied to Uvicorn) ───────────────────────
    location /api/ {
        # Rewrite /api/* to /* before forwarding to backend
        rewrite ^/api(/.*)$ $1 break;

        proxy_pass http://127.0.0.1:BACKEND_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running job operations
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Internal endpoints (no /api prefix, direct access) ─────
    location ~ ^/(jobs|internal/) {
        proxy_pass http://127.0.0.1:BACKEND_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

